<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery — {{ step if step is defined else 'Home' }}</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <script src="/static/js/htmx.min.js" defer></script>
</head>
<body>
  <header class="site-header">
    <h1>Technical Debt Discovery</h1>
    <nav class="step-nav">
      {% if access_key is defined and access_key %}
      <a href="{{ base_path }}/intake" class="{{ 'active' if step == 'intake' }}">Business Details</a>
      <a href="{{ base_path }}/objectives" class="{{ 'active' if step == 'objectives' }}">Objectives</a>
      <a href="{{ base_path }}/applications" class="{{ 'active' if step == 'applications' }}">Applications</a>
      <a href="{{ base_path }}/interview" class="{{ 'active' if step == 'interview' }}">Interview</a>
      <a href="{{ base_path }}/plan" class="{{ 'active' if step == 'plan' }}">Plan</a>
      {% endif %}
      <a href="/retrieve" class="nav-extra">Retrieve submission</a>
    </nav>
    <p class="security-badge" aria-label="Secured">Your information is secured</p>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
