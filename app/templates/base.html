<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Discovery — {{ step if step is defined else 'Home' }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ root_path }}/static/css/style.css">
  <script src="{{ root_path }}/static/js/htmx.min.js" defer></script>
  <script src="{{ root_path }}/static/js/ui.js" defer></script>
</head>
<body class="{% if step is defined %}step-{{ step }}{% endif %}">

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ root_path }}/" style="text-decoration:none;color:inherit;">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-text">
        Technical Debt Discovery
        <small>guided assessment</small>
      </span>
    </a>
    <div class="topbar-actions">
      <span class="topbar-secure">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Encrypted in transit
      </span>
      <a class="topbar-link" href="{{ root_path }}/retrieve">
        Retrieve submission
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
    </div>
  </div>
</header>

<main class="page">
  {% block content %}{% endblock %}
</main>

</body>
</html>
